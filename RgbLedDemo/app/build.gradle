plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.rgbleddemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.rgbleddemo'
        minSdk 27
        // Matches the device platform (Android 8.1 / LineageOS 15.1).
        targetSdk 27
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    lint {
        // targetSdk 27 is intentional for this platform build.
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }
}

dependencies {
    // RGB LED SDK stubs; the real classes come from the device framework at runtime.
    compileOnly files('libs/rgbled-sdk.jar')

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
